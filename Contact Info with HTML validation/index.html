<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Contact Info</title>
    <link rel="stylesheet" type="text/css" href="contact.css">
</head>

<body>
	<form action="confirm.html" method="post">
		<h1>My Contact Info</h1>
		<div>
			<label for="name">Name:</label>
			<input type="text" name="name" id="name" required autofocus>  <!--Added autofocus-->
		</div>
		<div>
			<label for="email">E-Mail:</label>
			<input type="email" name="email" id="email" required>
		</div>
		<div>
			<label for="phone">Mobile phone:</label>
			<input type="tel" name="phone" id="phone" required pattern="\d{3}[\-]\d{3}[\-]\d{4}"
				title="Please use the following format: nnn-nnn-nnnn" placeholder="xxx-xxx-xxxx"> <!--Used (x)s as they look better-->
		</div>
		<div>
			<label for="zip">ZIP Code:</label>
			<input type="text" name="zip" id="zip" required pattern="\d{5}([\-]\d{4})?"
				title="Please use the following format: nnnnn" placeholder="xxxxx">
		</div>
		<div>
			<label for="dob">Date of Birth:</label>
			<input type="date" name="dob" id="dob" required>
		</div>
		<div>
			<label></label>
			<button type="submit" id="save">Save</button>
			<button type="reset" id="reset">Reset</button> <!--Added button types-->
		</div>
	</form>
</body>
</html>
