<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Iterate through numbers 1-20
        for (let number = 1; number <= 21; number++){
            // Divisible by 3 and 5 = "FizzBuzz", 3 = "Fizz", 5 = "Buzz"
            if (number % 3 === 0 && number % 5 === 0){
                console.log("FizzBuzz");}
            else if (number % 3 === 0){
                console.log("Fizz");}
            else if (number % 5 === 0){
                console.log("Buzz");}
            // Print the number if not divisible by 3 or 5    
            else {
                console.log(number);}
        }        
    </script>
</body>
</html>
